name: Release

on:
  push:
    branches:
      - main
    tags:
      - "v*.*.*"

jobs:
  migrate:
    name: Run migrations
    runs-on: ubuntu-latest
    environment: production
    outputs:
      migration_success: ${{ steps.run_migration.outputs.success }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.5"
          cache-dependency-path: backend/migration/go.sum

      - name: Run migration
        id: run_migration
        working-directory: backend/migration
        env:
          POSTGRES_HOST: ${{ secrets.POSTGRES_HOST }}
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
          POSTGRES_PORT: ${{ secrets.POSTGRES_PORT }}
        run: |
          go run ./cmd/migrate
          echo "success=true" >> $GITHUB_OUTPUT

  regenerate-init-sql:
    name: Regenerate init.sql
    runs-on: ubuntu-latest
    needs: migrate
    environment: production
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install PostgreSQL client
        run: sudo apt-get install -y postgresql-client

      - name: Dump schema from prod DB
        env:
          PGPASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
        run: |
          pg_dump \
            --host=${{ secrets.POSTGRES_HOST }} \
            --port=${{ secrets.POSTGRES_PORT || 5432 }} \
            --username=${{ secrets.POSTGRES_USER }} \
            --dbname=${{ secrets.POSTGRES_DB }} \
            --schema-only \
            --no-owner \
            --no-privileges \
            --exclude-table=goose_db_version \
            > backend/migration/db/init.sql

      - name: Prepend auto-generated header
        run: |
          HEADER="-- Auto-generated schema snapshot. DO NOT EDIT MANUALLY.\n-- Regenerated by the release pipeline after each successful goose migration run.\n-- Source of truth for schema changes remains migration/db/migrations/*.sql\n"
          echo -e "$HEADER$(cat backend/migration/db/init.sql)" > backend/migration/db/init.sql

      - name: Commit updated init.sql
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add backend/migration/db/init.sql
          git diff --staged --quiet || git commit -m "chore: regenerate init.sql after migration [skip ci]"
          git push

  deploy:
    name: Deploy backend
    runs-on: ubuntu-latest
    needs: migrate
    environment: production
    steps:
      - uses: actions/checkout@v4

      # -----------------------------------------------------------------------
      # Replace the steps below with your actual deployment mechanism.
      # Examples: docker push + SSH deploy, kubectl apply, fly deploy, etc.
      # All prod DB connection details are available as secrets (see migrate job).
      # -----------------------------------------------------------------------

      - name: Build migration Docker image
        run: |
          docker build \
            -f backend/migration/Dockerfile \
            -t capuchin-migration:${{ github.sha }} \
            ./backend

      # Example: push to a registry
      # - name: Push to registry
      #   run: |
      #     echo "${{ secrets.REGISTRY_PASSWORD }}" | docker login -u "${{ secrets.REGISTRY_USER }}" --password-stdin
      #     docker tag capuchin-backend:${{ github.sha }} ${{ secrets.REGISTRY_HOST }}/capuchin-backend:${{ github.sha }}
      #     docker push ${{ secrets.REGISTRY_HOST }}/capuchin-backend:${{ github.sha }}

      # Example: SSH deploy
      # - name: Deploy via SSH
      #   uses: appleboy/ssh-action@v1
      #   with:
      #     host: ${{ secrets.DEPLOY_HOST }}
      #     username: ${{ secrets.DEPLOY_USER }}
      #     key: ${{ secrets.DEPLOY_SSH_KEY }}
      #     script: |
      #       docker pull ${{ secrets.REGISTRY_HOST }}/capuchin-backend:${{ github.sha }}
      #       docker compose -f /opt/capuchin/compose.yml up -d backend

      - name: Deployment placeholder
        run: echo "Deploy capuchin-backend:${{ github.sha }} to production"
