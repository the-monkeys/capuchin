name: Release

on:
  push:
    branches:
      - main
    tags:
      - "v*.*.*"

jobs:
  migrate:
    name: Run migrations
    runs-on: ubuntu-latest
    environment: production
    outputs:
      migration_success: ${{ steps.run_migration.outputs.success }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.5"
          cache-dependency-path: backend/migration/go.sum

      - name: Run migration
        id: run_migration
        working-directory: backend/migration
        env:
          POSTGRES_HOST: ${{ secrets.POSTGRES_HOST }}
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
          POSTGRES_PORT: ${{ secrets.POSTGRES_PORT }}
        run: |
          go run ./cmd/migrate
          echo "success=true" >> $GITHUB_OUTPUT

  regenerate-init-sql:
    uses: ./.github/workflows/regenerate-init-sql.yml
    needs: migrate
    with:
      environment: production
    secrets: inherit

  deploy:
    name: Deploy backend
    runs-on: ubuntu-latest
    needs: migrate
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Deployment placeholder
        run: echo "Deploy capuchin-backend:${{ github.sha }} to production"
