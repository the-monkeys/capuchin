name: Run Migrations (Manual)

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        default: "production"
        type: choice
        options:
          - production
          - staging
      regenerate_init_sql:
        description: "Regenerate init.sql after migration"
        required: true
        default: true
        type: boolean

jobs:
  migrate:
    name: Run migrations (${{ inputs.environment }})
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.5"
          cache-dependency-path: backend/migration/go.sum

      - name: Run migration
        working-directory: backend/migration
        env:
          POSTGRES_HOST: ${{ secrets.POSTGRES_HOST }}
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
          POSTGRES_PORT: ${{ secrets.POSTGRES_PORT }}
        run: go run ./cmd/migrate

  regenerate-init-sql:
    uses: ./.github/workflows/regenerate-init-sql.yml
    needs: migrate
    if: ${{ inputs.regenerate_init_sql }}
    with:
      environment: ${{ inputs.environment }}
    secrets: inherit
