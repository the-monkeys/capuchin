name: Run Migrations (Manual)

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        default: "production"
        type: choice
        options:
          - production
          - staging
      regenerate_init_sql:
        description: "Regenerate init.sql after migration"
        required: true
        default: true
        type: boolean

jobs:
  migrate:
    name: Run migrations (${{ inputs.environment }})
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.5"
          cache-dependency-path: backend/migration/go.sum

      - name: Run migration
        working-directory: backend/migration
        env:
          POSTGRES_HOST: ${{ secrets.POSTGRES_HOST }}
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
          POSTGRES_PORT: ${{ secrets.POSTGRES_PORT }}
        run: go run ./cmd/migrate

  regenerate-init-sql:
    name: Regenerate init.sql
    runs-on: ubuntu-latest
    needs: migrate
    environment: ${{ inputs.environment }}
    if: ${{ inputs.regenerate_init_sql }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install PostgreSQL client
        run: sudo apt-get install -y postgresql-client

      - name: Dump schema from DB
        env:
          PGPASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
        run: |
          pg_dump \
            --host=${{ secrets.POSTGRES_HOST }} \
            --port=${{ secrets.POSTGRES_PORT || 5432 }} \
            --username=${{ secrets.POSTGRES_USER }} \
            --dbname=${{ secrets.POSTGRES_DB }} \
            --schema-only \
            --no-owner \
            --no-privileges \
            --exclude-table=goose_db_version \
            > backend/migration/db/init.sql

      - name: Prepend auto-generated header
        run: |
          HEADER="-- Auto-generated schema snapshot. DO NOT EDIT MANUALLY.\n-- Regenerated by the release pipeline after each successful goose migration run.\n-- Source of truth for schema changes remains migration/db/migrations/*.sql\n"
          echo -e "$HEADER$(cat backend/migration/db/init.sql)" > backend/migration/db/init.sql

      - name: Commit updated init.sql
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add backend/migration/db/init.sql
          git diff --staged --quiet || git commit -m "chore: regenerate init.sql after manual migration [${{ inputs.environment }}] [skip ci]"
          git push
